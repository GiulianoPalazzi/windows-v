<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#8B5CF6"/>
      <stop offset="0.45" stop-color="#4F46E5"/>
      <stop offset="1"   stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#4F46E5"/>
      <stop offset="1"   stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.30" cy="0.22" r="0.95">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#1E1B4B" flood-opacity="0.38"/>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <!-- macOS-style squircle background -->
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#gloss)"/>
  </g>

  <!-- window / clipboard board -->
  <g filter="url(#cardShadow)">
    <rect x="132" y="230" width="760" height="580" rx="84" fill="#ffffff"/>
  </g>

  <!-- spring clip on the board -->
  <rect x="402" y="168" width="220" height="72" rx="36" fill="url(#clip)" stroke="#94A3B8" stroke-width="5"/>
  <rect x="420" y="186" width="184" height="30" rx="15" fill="#FFFFFF"/>

  <!-- subtle divider between the two halves -->
  <line x1="512" y1="268" x2="512" y2="772" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

  <!-- Apple logo (left half) -->
  <g transform="translate(187,340) scale(0.7031)" fill="url(#fg)">
    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
  </g>

  <!-- Windows logo (right half): 2x2 grid of rounded panes -->
  <g fill="url(#fg)">
    <rect x="554" y="374" width="132" height="132" rx="30"/>
    <rect x="714" y="374" width="132" height="132" rx="30"/>
    <rect x="554" y="534" width="132" height="132" rx="30"/>
    <rect x="714" y="534" width="132" height="132" rx="30"/>
  </g>
</svg>
